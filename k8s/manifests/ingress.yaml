apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-app-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  tls:
    - hosts:
        - example.local
      secretName: blog-app-tls
  rules:
    - host: example.local
      http:
        paths:
          - path: /api/posts
            pathType: Prefix
            backend:
              service:
                name: api-python
                port:
                  number: 80
          - path: /api/comments
            pathType: Prefix
            backend:
              service:
                name: api-go
                port:
                  number: 80
