services:
  api-python:
    build:
      context: ./services/api-python
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PORT: ${PORT:-8000}

  api-go:
    build:
      context: ./services/api-go
      dockerfile: Dockerfile
    ports:
      - "18080:8080"
    environment:
      PORT: ${PORT:-8080}
